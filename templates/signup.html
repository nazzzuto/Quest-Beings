{% extends "base.html" %}
{% block title %}Sign up · Quest-Beings{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card p-4">
      <h1 class="h4 mb-3">Create your account</h1>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input name="name" class="form-control" required maxlength="60">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input name="email" type="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" required minlength="8">
        </div>
        <button class="btn btn-primary w-100">Sign up</button>
      </form>
      <p class="mt-3 mb-0 small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
